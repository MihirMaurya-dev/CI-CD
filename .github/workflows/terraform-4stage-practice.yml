# ============================================================
#  4-Stage Terraform Pipeline – GitHub Actions (Practice)
#
#  Stage 1 → Terraform Init, Validate & Plan
#  Stage 2 → Security Scanning (tfsec + checkov)
#  Stage 3 → Manual Approval (GitHub Environment gate)
#  Stage 4 → Terraform Apply
# ============================================================

name: '🏗️ Terraform 4-Stage Practice Pipeline'

on:
  push:
    branches: [ "main" ]
    paths:
      - 'terraform/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'terraform/**'
  workflow_dispatch:    # ← allows manual trigger from GitHub UI

permissions:
  contents: read
  id-token: write       # needed for OIDC / Azure federated credentials
  pull-requests: write  # needed to post plan comments on PRs

# ── Global env vars ──────────────────────────────────────────
env:
  TF_VERSION: '1.9.5'
  TF_WORKING_DIR: './terraform'

  # Azure Backend (Terraform state)
  BACKEND_RESOURCE_GROUP:   'rg-terraform-state'
  BACKEND_STORAGE_ACCOUNT:  'sttfstatedev001'
  BACKEND_CONTAINER:        'tfstate'
  BACKEND_KEY:              'practice.terraform.tfstate'

# ============================================================
#  STAGE 1 – Terraform Init, Validate & Plan
# ============================================================
jobs:
  terraform_plan:
    name: '📋 Stage 1 - Terraform Init, Validate & Plan'
    runs-on: ubuntu-latest

    outputs:
      plan_exit_code: ${{ steps.plan.outputs.exitcode }}   # 0=no changes, 2=changes

    steps:
      # ── Checkout code ──────────────────────────────────────
      - name: '📥 Checkout Repository'
        uses: actions/checkout@v4

      # ── Azure Login (OIDC – no stored secrets) ─────────────
      - name: '🔑 Azure Login'
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Install Terraform ──────────────────────────────────
      - name: '🔧 Setup Terraform ${{ env.TF_VERSION }}'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── terraform init ─────────────────────────────────────
      - name: '🚀 Terraform Init'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ env.BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ env.BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ env.BACKEND_CONTAINER }}" \
            -backend-config="key=${{ env.BACKEND_KEY }}" \
            -input=false
        env:
          ARM_USE_OIDC: true

      # ── terraform fmt check ────────────────────────────────
      - name: '🎨 Terraform Format Check'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive
        continue-on-error: true   # warn only – does not fail the workflow

      # ── terraform validate ─────────────────────────────────
      - name: '✅ Terraform Validate'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      # ── terraform plan ─────────────────────────────────────
      - name: '📐 Terraform Plan'
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -out=tfplan \
            -detailed-exitcode \
            -input=false
        env:
          ARM_USE_OIDC: true
        # Exit codes: 0 = no changes, 1 = error, 2 = changes present

      # ── Show plan in human-readable form ───────────────────
      - name: '📄 Terraform Show (Human-Readable)'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform show -no-color tfplan

      # ── Post plan as PR comment ────────────────────────────
      - name: '💬 Post Plan to PR'
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### 📋 Terraform Plan – Stage 1
            \`terraform plan\` ran successfully.
            Plan exit code: \`${{ steps.plan.outputs.exitcode }}\`
            > 0 = No changes | 2 = Changes detected

            *Triggered by @${{ github.actor }}, workflow: \`${{ github.workflow }}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      # ── Upload plan as artifact ────────────────────────────
      - name: '📦 Upload Terraform Plan Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1   # plan artifacts should be short-lived

# ============================================================
#  STAGE 2 – Security Scanning
# ============================================================
  security_scan:
    name: '🔐 Stage 2 - Security Scanning'
    runs-on: ubuntu-latest
    needs: terraform_plan
    # Run in parallel with plan-dependent checks, or after plan
    # We run after plan to scan the same code that was planned

    steps:
      - name: '📥 Checkout Repository'
        uses: actions/checkout@v4

      # ── tfsec (Aqua Security) ──────────────────────────────
      - name: '🔍 Run tfsec'
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.TF_WORKING_DIR }}
          format: sarif
          additional_args: '--minimum-severity MEDIUM'
        continue-on-error: true   # report issues but don't block

      # ── checkov (Bridgecrew / Palo Alto) ──────────────────
      - name: '🛡️ Run checkov'
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ env.TF_WORKING_DIR }}
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true         # report issues but don't block

      # ── Upload SARIF results to GitHub Security tab ────────
      - name: '📊 Upload checkov SARIF to Security Tab'
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov

      # ── Trivy IaC scan ─────────────────────────────────────
      - name: '🔭 Run Trivy IaC Scan'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: ${{ env.TF_WORKING_DIR }}
          format: 'table'
          exit-code: '0'          # report only
          severity: 'CRITICAL,HIGH'

# ============================================================
#  STAGE 3 – Manual Approval Gate
# ============================================================
  manual_approval:
    name: '🙋 Stage 3 - Manual Approval'
    runs-on: ubuntu-latest
    needs: [terraform_plan, security_scan]
    # Only gate on pushes to main (not PRs)
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    # ── GitHub Environment with Protection Rules ───────────
    # → Go to Settings → Environments → Create "production"
    # → Add "Required reviewers" with your GitHub username
    # → Pipeline pauses here until a reviewer approves
    environment:
      name: production           # <-- protection rules live here

    steps:
      - name: '✅ Approval Confirmed – Proceeding to Apply'
        run: |
          echo "=============================================="
          echo "  ✅ Approval received! Starting Apply..."
          echo "=============================================="
          echo "Approved by:  ${{ github.actor }}"
          echo "Run ID:       ${{ github.run_id }}"
          echo "Repository:   ${{ github.repository }}"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Commit SHA:   ${{ github.sha }}"

# ============================================================
#  STAGE 4 – Terraform Apply
# ============================================================
  terraform_apply:
    name: '🚀 Stage 4 - Terraform Apply'
    runs-on: ubuntu-latest
    needs: manual_approval
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
      # ── Checkout code ──────────────────────────────────────
      - name: '📥 Checkout Repository'
        uses: actions/checkout@v4

      # ── Azure Login ────────────────────────────────────────
      - name: '🔑 Azure Login'
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Install Terraform ──────────────────────────────────
      - name: '🔧 Setup Terraform ${{ env.TF_VERSION }}'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── terraform init (required before apply) ─────────────
      - name: '🚀 Terraform Init'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ env.BACKEND_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ env.BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ env.BACKEND_CONTAINER }}" \
            -backend-config="key=${{ env.BACKEND_KEY }}" \
            -input=false
        env:
          ARM_USE_OIDC: true

      # ── Download the plan artifact from Stage 1 ────────────
      - name: '⬇️ Download Terraform Plan Artifact'
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}

      # ── terraform apply (using saved plan) ────────────────
      - name: '⚡ Terraform Apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan
        env:
          ARM_USE_OIDC: true

      # ── Apply Summary ──────────────────────────────────────
      - name: '🎉 Apply Summary'
        run: |
          echo "=============================================="
          echo "  🎉 Terraform Apply completed successfully!"
          echo "=============================================="
          echo "Triggered by: ${{ github.actor }}"
          echo "Run ID:       ${{ github.run_id }}"
          echo "Commit:       ${{ github.sha }}"
