name: Terraform CI/CD

on:
  push:
    branches:
      - main
      - feature
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  setup:
    name: Identify Modified Terraform Folders
    runs-on: ubuntu-latest

    outputs:
      folders: ${{ steps.filter.outputs.folders }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          separator: "\n"

      - name: Identify Terraform folders
        id: filter
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          set -euo pipefail

          declare -A dirs=()

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            dir="$(dirname "$file")"

            if [[ -d "$dir" ]] && compgen -G "$dir/*.tf" > /dev/null; then
              dirs["$dir"]=1
            fi
          done <<< "$CHANGED_FILES"

          if [[ ${#dirs[@]} -eq 0 ]]; then
            echo 'folders=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "${!dirs[@]}" |
            sort |
            jq -R -s -c 'split("\n") | map(select(length > 0))' |
            {
              read -r folders
              echo "folders=$folders" >> "$GITHUB_OUTPUT"
            }

  security-scan-global:
    name: Global Secret Scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail

          curl -sSfL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz \
            | tar -xz

          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Install TruffleHog
        shell: bash
        run: |
          set -euo pipefail

          curl -sSfL \
            https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --verbose

      - name: Run TruffleHog
        run: |
          trufflehog filesystem . \
            --fail

  terraform-checks:
    name: Terraform Checks
    needs:
      - setup

    if: ${{ needs.setup.outputs.folders != '[]' && needs.setup.outputs.folders != '' }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.setup.outputs.folders) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Terraform Azure credentials
        shell: bash
        run: |
          set -euo pipefail
          
          echo "ARM_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> "$GITHUB_ENV"
          echo "ARM_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Install tfsec
        shell: bash
        run: |
          set -euo pipefail

          curl -sSfL \
            https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh \
            | bash

      - name: Install Trivy
        shell: bash
        run: |
          set -euo pipefail

          curl -sfL \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin latest

      - name: Setup Infracost
        if: ${{ secrets.INFRACOST_API_KEY != '' }}
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Terraform Init
        working-directory: ${{ matrix.folder }}
        run: |
          terraform init \
            -backend=false \
            -input=false

      - name: Terraform Format Check
        working-directory: ${{ matrix.folder }}
        run: |
          terraform fmt \
            -check \
            -recursive

      - name: Terraform Validate
        working-directory: ${{ matrix.folder }}
        run: |
          terraform validate

      - name: Run tfsec
        working-directory: ${{ matrix.folder }}
        run: |
          tfsec .

      - name: Run TFLint
        working-directory: ${{ matrix.folder }}
        run: |
          tflint --init
          tflint

      - name: Run Trivy
        working-directory: ${{ matrix.folder }}
        run: |
          trivy config .

      - name: Run Infracost
        if: ${{ secrets.INFRACOST_API_KEY != '' }}
        working-directory: ${{ matrix.folder }}
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          infracost breakdown \
            --path .

      - name: Terraform Plan
        working-directory: ${{ matrix.folder }}
        run: |
          terraform plan \
            -input=false \
            -out=tfplan
