name: Enterprise Terraform CI/CD

on:
  push:
    branches: [ "main", "feature" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  # ============================================================
  # 1. Identify Modified Terraform Folders (Dynamic Matrix)
  # ============================================================
  setup:
    name: Identify Modified Folders
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.changed-dirs.outputs.all_changed_files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed Terraform folders
        id: changed-dirs
        uses: tj-actions/changed-files@v47
        with:
          files: '**/*.tf'
          files_ignore: '**/modules/**' # Exclude child modules 
          dir_names: true               # Output only directory names
          json: true                    # Output as JSON array for the matrix
          escape_json: false            

  # ============================================================
  # 2. Global Security Scanning
  # ============================================================
  security-scan:
    name: Secret & Vulnerability Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # ============================================================
  # 3. Terraform Checks & Plan
  # ============================================================
  terraform-checks:
    name: Terraform Checks & Plan
    needs: setup
    if: ${{ needs.setup.outputs.folders != '[]' && needs.setup.outputs.folders != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.setup.outputs.folders) }}
    env:
      ARM_USE_CLI: true # Tells Terraform to use the auth token from azure/login
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ matrix.folder }}
        run: terraform init -input=false

      - name: Terraform Format & Validate
        working-directory: ${{ matrix.folder }}
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: Run Security Scans (tfsec & Trivy)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ matrix.folder }}
          
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: ${{ matrix.folder }}
          hide-progress: true

      - name: Run TFLint
        uses: terraform-linters/setup-tflint@v4
        
      - name: Init & Run TFLint
        working-directory: ${{ matrix.folder }}
        run: tflint --init && tflint

      - name: Terraform Plan
        working-directory: ${{ matrix.folder }}
        run: terraform plan -input=false -out=tfplan

      - name: Setup & Run Infracost
        if: ${{ env.INFRACOST_API_KEY != '' }}
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ env.INFRACOST_API_KEY }}
          
      - name: Run Infracost Breakdown
        if: ${{ env.INFRACOST_API_KEY != '' }}
        working-directory: ${{ matrix.folder }}
        run: infracost breakdown --path tfplan

      - name: Create Slug & Upload Plan
        run: |
          SLUG=$(echo '${{ matrix.folder }}' | tr '/' '-')
          echo "SLUG=$SLUG" >> $GITHUB_ENV
          
      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.SLUG }}
          path: ${{ matrix.folder }}/tfplan
          retention-days: 1

  # ============================================================
  # 4. Terraform Apply (Main Branch Only)
  # ============================================================
  terraform-apply:
    name: Terraform Apply
    needs: [setup, terraform-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.setup.outputs.folders) }}
    env:
      ARM_USE_CLI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ matrix.folder }}
        run: terraform init -input=false

      - name: Create Slug & Download Plan
        run: |
          SLUG=$(echo '${{ matrix.folder }}' | tr '/' '-')
          echo "SLUG=$SLUG" >> $GITHUB_ENV

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.SLUG }}
          path: ${{ matrix.folder }}

      - name: Terraform Apply
        working-directory: ${{ matrix.folder }}
        run: terraform apply -auto-approve tfplan
