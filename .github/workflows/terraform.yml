name: Terraform CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  setup:
    name: Identify Modified Folders
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.filter.outputs.folders }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44

      - name: Filter Terraform folders
        id: filter
        run: |
          changed_files="${{ steps.changed-files.outputs.all_changed_files }}"
          dirs=()
          for file in $changed_files; do
            dir="$(dirname "$file")"
            if [ -d "$dir" ] && ls "$dir"/*.tf 1> /dev/null 2>&1; then
              dirs+=("$dir")
            fi
          done
          
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "folders=[]" >> $GITHUB_OUTPUT
          else
            unique_dirs=$(printf "%s\n" "${dirs[@]}" | sort -u)
            json_array=$(printf '%s\n' "$unique_dirs" | jq -R . | jq -s -c .)
            echo "folders=$json_array" >> $GITHUB_OUTPUT
          fi

  security-scan-global:
    name: Global Secret Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Gitleaks
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar xz
          sudo mv gitleaks /usr/local/bin/

      - name: Setup Trufflehog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Run Gitleaks
        run: gitleaks detect -v --source . || echo "Gitleaks found issues."

      - name: Run Trufflehog
        run: trufflehog filesystem . --fail || echo "Trufflehog found issues."

  terraform-checks:
    name: Terraform Plan & Security
    needs: setup
    if: ${{ needs.setup.outputs.folders != '[]' && needs.setup.outputs.folders != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.setup.outputs.folders) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIAL }}

      - name: Export Azure Credentials for Terraform
        run: |
          CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIAL }}' | jq -r '.clientId // .appId // empty')
          CLIENT_SECRET=$(echo '${{ secrets.AZURE_CREDENTIAL }}' | jq -r '.clientSecret // .password // empty')
          TENANT_ID=$(echo '${{ secrets.AZURE_CREDENTIAL }}' | jq -r '.tenantId // .tenant // empty')
          SUB_ID=$(echo '${{ secrets.AZURE_CREDENTIAL }}' | jq -r '.subscriptionId // empty')
          
          echo "ARM_CLIENT_ID=$CLIENT_ID" >> $GITHUB_ENV
          echo "ARM_CLIENT_SECRET=$CLIENT_SECRET" >> $GITHUB_ENV
          echo "ARM_TENANT_ID=$TENANT_ID" >> $GITHUB_ENV
          if [ -n "$SUB_ID" ]; then
            echo "ARM_SUBSCRIPTION_ID=$SUB_ID" >> $GITHUB_ENV
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Setup tfsec
        run: curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Setup Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin latest

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY || 'dummy' }}

      - name: Terraform Init
        working-directory: ${{ matrix.folder }}
        run: terraform init -backend=false

      - name: Terraform Format
        working-directory: ${{ matrix.folder }}
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: ${{ matrix.folder }}
        run: terraform validate

      - name: Run tfsec
        working-directory: ${{ matrix.folder }}
        run: tfsec . || true

      - name: Run tflint
        working-directory: ${{ matrix.folder }}
        run: |
          tflint --init
          tflint || true

      - name: Run Trivy
        working-directory: ${{ matrix.folder }}
        run: trivy config . || true

      - name: Run Infracost
        working-directory: ${{ matrix.folder }}
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          if [ -n "$INFRACOST_API_KEY" ]; then
            infracost breakdown --path . || true
          else
            echo "Skipping Infracost (API key not set)"
          fi

      - name: Terraform Plan
        working-directory: ${{ matrix.folder }}
        run: terraform plan -out=tfplan
