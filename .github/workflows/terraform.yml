name: 'Terraform Validation & Security Scans'

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  terraform-check:
    name: 'Terraform Plan and Scans'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Install Security Scanners (tfsec, tflint, trivy, infracost, gitleaks, trufflehog)
      run: |
        echo "Installing tfsec..."
        curl -s https://raw.githubusercontent.com/aquasecurity/tfsec/master/scripts/install_linux.sh | bash
        
        echo "Installing tflint..."
        curl -s https://raw.githubusercontent.com/terraform-linters/tflint/master/install_linux.sh | bash
        
        echo "Installing trivy..."
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v0.49.1
        
        echo "Installing infracost..."
        curl -fsSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sudo sh
        
        echo "Installing gitleaks..."
        curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar xz
        sudo mv gitleaks /usr/local/bin/
        
        echo "Installing trufflehog..."
        curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sudo sh -s -- -b /usr/local/bin

    - name: Run Global Secret Scans
      run: |
        echo "--> Running Gitleaks (Full Repo)"
        gitleaks detect -v --source . || echo "Gitleaks found potential secrets but continuing."
        
        echo "--> Running Trufflehog (Full Repo)"
        trufflehog filesystem . --fail || echo "Trufflehog found potential secrets but continuing."

    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v44

    - name: Run Terraform & Security Scans on Modified Folders
      env:
        # Note: You need to set INFRACOST_API_KEY in your GitHub Repository Secrets
        INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
      run: |
        echo "Identifying modified directories..."
        changed_files="${{ steps.changed-files.outputs.all_changed_files }}"
        
        if [ -z "$changed_files" ]; then
          echo "No files changed."
          exit 0
        fi

        dirs=()
        for file in $changed_files; do
          dirs+=("$(dirname "$file")")
        done
        unique_dirs=$(printf "%s\n" "${dirs[@]}" | sort -u)

        for dir in $unique_dirs; do
          if [ -d "$dir" ] && ls "$dir"/*.tf 1> /dev/null 2>&1; then
            echo "===================================================="
            echo "Processing Directory: $dir"
            echo "===================================================="
            cd "$dir"
            
            echo "--> 1. Running Terraform Init"
            terraform init -backend=false

            echo "--> 2. Running Terraform Format"
            terraform fmt -check

            echo "--> 3. Running Terraform Validate"
            terraform validate
            
            echo "--> 4. Running tfsec"
            tfsec . || echo "tfsec found issues."
            
            echo "--> 5. Running tflint"
            tflint --init
            tflint || echo "tflint found issues."
            
            echo "--> 6. Running Trivy config scan"
            trivy config . || echo "Trivy found issues."
            
            echo "--> 7. Running Infracost"
            if [ -z "$INFRACOST_API_KEY" ]; then
              echo "Skipping Infracost: INFRACOST_API_KEY is not set in secrets."
            else
              infracost breakdown --path . || echo "Infracost found issues."
            fi
            
            echo "--> 8. Running Terraform Plan"
            terraform plan -out=tfplan
            
            cd $GITHUB_WORKSPACE
          fi
        done
